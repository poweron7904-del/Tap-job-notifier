name: Automated Job Monitor Fixed
on:
  repository_dispatch:
    types: [trigger_30_min_check]
  workflow_dispatch:

concurrency:
  group: seen-jobs-notifier
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull repository files with an explicit checkout depth to prevent blank workspaces
    - name: Checkout Code Files
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # 2. Directly setup Python without any cache checks
    - name: Set up Clean Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. Force direct installation of your required modules via command strings
    - name: Force Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 python-dotenv

    # 4. Launch your script — seen_jobs.json is read/written directly from the repo checkout
    - name: Execute Live Script
      env:
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        JOBS_URL: ${{ secrets.JOBS_URL }}
        AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python job.py

    # 5. Commit the updated seen_jobs.json back to the repo, only if it changed
    - name: Commit updated seen_jobs.json
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add seen_jobs.json
        git diff --quiet --cached || git commit -m "Update seen jobs [skip ci]"
        git pull --rebase
        git push
