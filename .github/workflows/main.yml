name: Automated Job Monitor

on:
  schedule:
    # Runs every 30 minutes, 24/7 (UTC time)
    - cron: '*/30 * * * *'
  # Allows you to manually trigger the check anytime from the GitHub interface
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
    # 1. Downloads your code from the repository into the runner environment
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # 2. Directly execute dependencies using the system built-in environment
    - name: Force Execute Script
      env:
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        JOBS_URL: ${{ secrets.JOBS_URL }}
        AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        pip3 install requests beautifulsoup4 python-dotenv
        python3 job.py
