name: Automated Job Monitor Fixed
on:
  repository_dispatch:
    types: [trigger_30_min_check]
  workflow_dispatch:
jobs:
  check-website:
    runs-on: ubuntu-latest
    steps:
    # 1. Pull repository files with an explicit checkout depth to prevent blank workspaces
    - name: Checkout Code Files
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    # 2. Directly setup Python without any cache checks
    - name: Set up Clean Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    # 3. Force direct installation of your required modules via command strings
    - name: Force Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 python-dotenv
    # 4. Restore the seen-jobs cache so we don't re-notify on every run
    - name: Restore seen jobs cache
      uses: actions/cache@v4
      with:
        path: seen_jobs.json
        key: seen-jobs-cache
        restore-keys: seen-jobs-cache
    # 5. Launch your script
    - name: Execute Live Script
      env:
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        JOBS_URL: ${{ secrets.JOBS_URL }}
        AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python job.py
    # 6. Save the updated seen-jobs cache so the next run knows what's already been sent
    - name: Save seen jobs cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: seen_jobs.json
        key: seen-jobs-cache
