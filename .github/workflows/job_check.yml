name: Automated Job Monitor Fixed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check-website:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Files
      uses: actions/checkout@v4

    - name: Set up Clean Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        # NO CACHE INCLUDED HERE SO IT NEVER SCANS FOR THE FILE

    - name: Force Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 python-dotenv

    - name: Execute Live Script
      env:
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        JOBS_URL: ${{ secrets.JOBS_URL }}
        AUTH_USERNAME: ${{ secrets.AUTH_USERNAME }}
        AUTH_PASSWORD: ${{ secrets.AUTH_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python job.py
